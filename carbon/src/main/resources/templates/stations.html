<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{stations.title}">充電站管理 - 碳權平台</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/dataTables.bootstrap4.min.css">
    <!-- 自定義CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        /* 彩色國旗圖標 */
        .flag-icon {
            width: 20px;
            height: 15px;
            margin-right: 8px;
            vertical-align: middle;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        
        /* 操作按钮样式 */
        .action-buttons {
            white-space: nowrap;
        }
        
        .action-buttons .btn {
            margin-right: 5px;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        
        /* 隱藏 DataTable 自帶的搜尋框 */
        div.dataTables_filter {
            display: none !important;
        }
        
        /* 國家篩選下拉框樣式調整 */
        #countryFilter {
            min-width: 100px !important;
            max-width: 120px !important;
            padding-right: 20px !important;
        }
    </style>
</head>
<body>
    <!-- 隱藏的翻譯元素 -->
    <div style="display: none;">
        <span id="traditionalGridText" th:text="#{message.traditionalGrid}">傳統電網</span>
        <span id="greenEnergyText" th:text="#{message.greenEnergy}">綠能</span>
        <span id="undefinedText" th:text="#{message.undefined}">未定義</span>
    </div>
    
    <nav class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 mr-0 px-3" href="#">
            <i class="fas fa-leaf mr-2"></i><span th:text="#{app.name}">碳權平台</span>
        </a>
        <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-toggle="collapse" data-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <ul class="navbar-nav px-3 ml-auto d-flex flex-row">
            <!-- 語言選擇器 -->
            <li class="nav-item dropdown mr-3">
                <a class="nav-link dropdown-toggle" href="#" id="languageDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    <i class="fas fa-globe-asia mr-2"></i><span th:text="#{language.select}">語言</span>
                </a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="languageDropdown">
                    <button class="dropdown-item language-switch-btn" data-lang="en">
                        <img src="https://cdn.jsdelivr.net/npm/flag-icon-css@3.5.0/flags/4x3/us.svg" class="flag-icon" alt="USA flag">
                        <span th:text="#{language.en}">English</span>
                    </button>
                    <button class="dropdown-item language-switch-btn" data-lang="zh_TW">
                        <img src="https://cdn.jsdelivr.net/npm/flag-icon-css@3.5.0/flags/4x3/tw.svg" class="flag-icon" alt="Taiwan flag">
                        <span th:text="#{language.zh}">繁體中文</span>
                    </button>
                </div>
            </li>
            <li class="nav-item text-nowrap">
                <a class="nav-link" href="#" onclick="logout()">
                    <i class="fas fa-sign-out-alt mr-2"></i><span th:text="#{nav.logout}">退出</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- 引入側邊欄組件 -->
            <div th:replace="sidebar :: sidebar"></div>
            
            <main role="main" class="col-md-9 ml-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">
                        <i class="fas fa-charging-station text-primary mr-2"></i>
                        <span th:text="#{stations.title}">充電站管理</span>
                    </h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="input-group mr-2">
                            <input type="text" class="form-control" id="searchInput" th:placeholder="#{stations.search}" placeholder="搜索充電站...">
                        </div>
                        <div class="btn-group mr-2">
                            <button type="button" class="btn btn-sm btn-success" id="addStationBtn" style="display: none;">
                                <i class="fas fa-plus"></i> <span th:text="#{stations.add}">新增充電站</span>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-primary" id="refreshBtn">
                                <i class="fas fa-sync-alt mr-1"></i><span th:text="#{stations.refresh}">刷新</span>
                            </button>
                        </div>
                        <select class="custom-select custom-select-sm mr-2" id="countryFilter" style="min-width: 100px; max-width: 120px;">
                            <option value="" th:text="#{transactions.allCountries}">全部國家</option>
                            <!-- 國家選項將通過JavaScript加載 -->
                        </select>
                        <select class="custom-select" id="statusFilter" style="width: auto;">
                            <option value="" th:text="#{stations.allStatus}">全部狀態</option>
                            <option value="1" th:text="#{stations.enabled}">啟用</option>
                            <option value="0" th:text="#{stations.disabled}">禁用</option>
                        </select>
                    </div>
                </div>
                
                <div class="alert alert-primary eco-info-box p-3 mb-4">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <i class="fas fa-info-circle fa-2x text-primary"></i>
                        </div>
                        <div class="col">
                            <h5 class="m-0" th:text="#{sidebar.stations}">充電站</h5>
                            <p class="small m-0" th:text="#{stations.info}">查看和管理所有充電站信息，支持按名稱搜索和狀態篩選。</p>
                        </div>
                    </div>
                </div>
                
                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
                <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="stationsTable">
                        <thead>
                            <tr>
                                <th th:text="#{stations.id}">充電站ID</th>
                                <th th:text="#{stations.vendorId}">廠商ID</th>
                                <th th:text="#{stations.name}">充電站名稱</th>
                                <th th:text="#{stations.power}">充電站功率</th>
                                <th th:text="#{stations.city}">城市</th>
                                <th th:text="#{stations.address}">地址</th>
                                <th th:text="#{stations.storageEnabled}">儲能啟用</th>
                                <th th:text="#{stations.powerSource}">電源來源</th>
                                <th th:text="#{stations.latitude}">GPS緯度</th>
                                <th th:text="#{stations.longitude}">GPS經度</th>
                                <th th:text="#{stations.status}">狀態</th>
                                <th th:text="#{stations.uploadTime}">上傳時間</th>
                                <th id="actionsHeader" style="display: none;" th:text="#{stations.actions}">操作</th>
                            </tr>
                        </thead>
                        <tbody id="stationsTableBody">
                            <!-- 數據將通過JavaScript加載 -->
                        </tbody>
                    </table>
                </div>
                
                <div id="loadingSpinner" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="sr-only" th:text="#{message.loading}">載入中...</span>
                    </div>
                    <p class="mt-2" th:text="#{stations.loading}">正在加載充電站數據，請稍候...</p>
                </div>
                
                <div class="card mt-4 bg-light">
                    <div class="card-body">
                        <h5 class="card-title">
                            <i class="fas fa-leaf text-success mr-2"></i><span th:text="#{stations.eco}">環保與減碳</span>
                        </h5>
                        <p class="card-text" th:text="#{stations.ecoDesc}">
                            綠色充電站是減少碳排放的重要環節。通過優化充電站佈局和能源管理，可以顯著降低整體能源消耗。
                        </p>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- 页脚 -->
        <footer class="footer mt-auto py-3 bg-light">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-6">
                        <span class="text-muted" th:text="#{footer.copyright}">© 2025 碳權平台. 保留所有權利.</span>
                    </div>
                    <div class="col-md-6 text-md-right">
                        <span class="text-muted">
                            <span th:text="#{footer.developed}">開發商</span>: 
                            <span th:text="#{footer.company.en}">gochabar</span> / 
                            <span th:text="#{footer.company.zh}">充壩</span>
                        </span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- 充電站編輯模態框 -->
    <div class="modal fade" id="stationModal" tabindex="-1" role="dialog" aria-labelledby="stationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="stationModalLabel">新增充電站</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="stationForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="stationId" th:text="#{stations.id}">充電站ID <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="stationId" name="stationId" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="vendorId" th:text="#{stations.vendorId}">廠商ID <span class="text-danger">*</span></label>
                                    <select class="form-control" id="vendorId" name="vendorId" required>
                                        <option value="" th:text="#{message.pleaseSelect}">請選擇廠商</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="stationName" th:text="#{stations.name}">充電站名稱</label>
                                    <input type="text" class="form-control" id="stationName" name="stationName">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="stationKwh" th:text="#{stations.power}">充電站功率</label>
                                    <input type="text" class="form-control" id="stationKwh" name="stationKwh">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="city" th:text="#{stations.city}">城市</label>
                                    <input type="text" class="form-control" id="city" name="city">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="address" th:text="#{stations.address}">地址</label>
                                    <input type="text" class="form-control" id="address" name="address">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="storageEnable" th:text="#{stations.storageEnabled}">儲能啟用</label>
                                    <select class="form-control" id="storageEnable" name="storageEnable">
                                        <option value="" th:text="#{message.pleaseSelect}">請選擇</option>
                                        <option value="1" th:text="#{message.yes}">是</option>
                                        <option value="0" th:text="#{message.no}">否</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="powerSource" th:text="#{stations.powerSource}">電源來源</label>
                                    <select class="form-control" id="powerSource" name="powerSource">
                                        <option value="" th:text="#{message.pleaseSelect}">請選擇</option>
                                        <option value="1" th:text="#{message.traditionalGrid}">傳統電網</option>
                                        <option value="2" th:text="#{message.greenEnergy}">綠能</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="stationStatus" th:text="#{stations.status}">狀態</label>
                                    <select class="form-control" id="stationStatus" name="stationStatus">
                                        <option value="" th:text="#{message.pleaseSelect}">請選擇</option>
                                        <option value="1" th:text="#{stations.enabled}">啟用</option>
                                        <option value="0" th:text="#{stations.disabled}">禁用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="gpsLatitude" th:text="#{stations.latitude}">GPS緯度</label>
                                    <input type="text" class="form-control" id="gpsLatitude" name="gpsLatitude" th:placeholder="#{message.latitudeExample}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="gpsLongitude" th:text="#{stations.longitude}">GPS經度</label>
                                    <input type="text" class="form-control" id="gpsLongitude" name="gpsLongitude" th:placeholder="#{message.longitudeExample}">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{action.cancel}">取消</button>
                    <button type="button" class="btn btn-primary" id="saveStationBtn" th:text="#{action.save}">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 刪除確認模態框 -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" role="dialog" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteConfirmModalLabel" th:text="#{stations.deleteConfirmTitle}">確認刪除</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <p th:text="#{admin.confirmDeleteStation}">您確定要刪除充電站 <strong id="deleteStationName"></strong> 嗎？</p>
                    <p class="text-danger" th:text="#{admin.deleteWarning}">此操作無法撤銷！</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" th:text="#{button.cancel}">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn" th:text="#{stations.deleteConfirmBtn}">確認刪除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery, Bootstrap, DataTables -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/dataTables.bootstrap4.min.js"></script>
    <!-- 多語言支持 -->
    <script th:src="@{/js/locale.js}"></script>
    <!-- 自定義JavaScript -->
    <script th:src="@{/js/common.js}"></script>
    <script>
        let dataTable;
        let stations = [];
        let allStationsData = []; // 保存所有站點數據（用於國家篩選下拉框）
        let vendors = [];
        let currentUserRole = null;
        let isEditMode = false;
        let editingStationId = null;
        
        // 國家代碼到國家名稱的映射（支援多語系）
        function getCountryName(countryCode, lang) {
            if (!countryCode || countryCode === 'NA') {
                return lang === 'en' ? 'N/A' : '不適用';
            }
            
            const countryMap = {
                'TW': { zh: '台灣', en: 'Taiwan' },
                'US': { zh: '美國', en: 'United States' },
                'CN': { zh: '中國', en: 'China' },
                'JP': { zh: '日本', en: 'Japan' },
                'KR': { zh: '韓國', en: 'South Korea' },
                'SG': { zh: '新加坡', en: 'Singapore' },
                'MY': { zh: '馬來西亞', en: 'Malaysia' },
                'TH': { zh: '泰國', en: 'Thailand' },
                'VN': { zh: '越南', en: 'Vietnam' },
                'PH': { zh: '菲律賓', en: 'Philippines' },
                'ID': { zh: '印尼', en: 'Indonesia' },
                'IN': { zh: '印度', en: 'India' },
                'GB': { zh: '英國', en: 'United Kingdom' },
                'FR': { zh: '法國', en: 'France' },
                'DE': { zh: '德國', en: 'Germany' },
                'IT': { zh: '義大利', en: 'Italy' },
                'ES': { zh: '西班牙', en: 'Spain' },
                'AU': { zh: '澳洲', en: 'Australia' },
                'NZ': { zh: '紐西蘭', en: 'New Zealand' },
                'CA': { zh: '加拿大', en: 'Canada' },
                'MX': { zh: '墨西哥', en: 'Mexico' },
                'BR': { zh: '巴西', en: 'Brazil' },
                'AR': { zh: '阿根廷', en: 'Argentina' },
                'RU': { zh: '俄羅斯', en: 'Russia' },
                'AE': { zh: '阿拉伯聯合大公國', en: 'United Arab Emirates' },
                'SA': { zh: '沙烏地阿拉伯', en: 'Saudi Arabia' },
                'ZA': { zh: '南非', en: 'South Africa' },
                'EG': { zh: '埃及', en: 'Egypt' }
            };
            
            const country = countryMap[countryCode.toUpperCase()];
            if (country) {
                return country[lang] || countryCode;
            }
            
            // 如果找不到映射，返回國家代碼
            return countryCode;
        }
        
        // 填充國家篩選下拉框
        function populateCountryFilter() {
            const countryFilter = document.getElementById('countryFilter');
            const currentLang = getCurrentLanguage();
            // 嘗試從翻譯函數獲取，如果失敗則從 DOM 讀取已渲染的文字
            let allCountriesText = translate('transactions.allCountries');
            // 如果翻譯函數返回 key 本身（表示找不到翻譯），嘗試從 DOM 讀取
            if (allCountriesText === 'transactions.allCountries') {
                const defaultOption = countryFilter.querySelector('option[value=""]');
                if (defaultOption) {
                    allCountriesText = defaultOption.textContent || (currentLang === 'en' ? 'All Countries' : '全部國家');
                } else {
                    allCountriesText = currentLang === 'en' ? 'All Countries' : '全部國家';
                }
            }
            
            // 保存當前選中的國家
            const currentSelectedCountry = countryFilter ? countryFilter.value : '';
            
            countryFilter.innerHTML = `<option value="">${allCountriesText}</option>`;
            
            // 使用所有站點數據（allStationsData）而不是篩選後的數據（stations）
            if (allStationsData.length === 0) {
                return;
            }
            
            // 提取所有唯一的國家代碼
            const countrySet = new Set();
            allStationsData.forEach(station => {
                if (station.country && station.country.trim() !== '' && station.country !== 'NA') {
                    countrySet.add(station.country.toUpperCase());
                }
            });
            
            // 將國家代碼轉換為陣列並排序
            const countries = Array.from(countrySet).sort();
            
            // 填充下拉框（批量生成 HTML，減少 DOM 操作）
            const options = [`<option value="">${allCountriesText}</option>`];
            countries.forEach(countryCode => {
                options.push(`<option value="${countryCode}">${getCountryName(countryCode, currentLang)}</option>`);
            });
            countryFilter.innerHTML = options.join('');
            
            // 恢復之前選中的國家
            if (currentSelectedCountry) {
                countryFilter.value = currentSelectedCountry;
            }
        }
        
        // 初始化DataTable
        function initDataTable() {
            if (dataTable) {
                dataTable.destroy();
            }
            
            // 獲取當前語言
            const currentLang = getCurrentLanguage();
            
            // 設置語言檔案路徑
            let languageUrl = '/carbon/js/datatables/i18n/Chinese-traditional.json';
            if (currentLang === 'en') {
                languageUrl = '/carbon/js/datatables/i18n/English.json';
            }
            
            // 根據用戶角色決定是否顯示操作列
            let columns = [
                { data: 'stationId' },
                { data: 'vendorId' },
                { data: 'stationName' },
                { data: 'stationKwh' },
                { data: 'city' },
                { data: 'address' },
                { 
                    data: 'storageEnable',
                    render: function(data) {
                        return data === '1' ? 
                            translate('Yes') : 
                            (data === '0' ? translate('No') : '');
                    }
                },
                { 
                    data: 'powerSource',
                    render: function(data) {
                        if (data === '1') {
                            return document.getElementById('traditionalGridText').textContent;
                        } else if (data === '2') {
                            return document.getElementById('greenEnergyText').textContent;
                        } else {
                            return document.getElementById('undefinedText').textContent;
                        }
                    }
                },
                { data: 'gpsLatitude' },
                { data: 'gpsLongitude' },
                { 
                    data: 'stationStatus',
                    render: function(data) {
                        if (data === '1') {
                            return `<span class="badge badge-success">${translate('Enabled')}</span>`;
                        } else if (data === '0') {
                            return `<span class="badge badge-secondary">${translate('Disabled')}</span>`;
                        }
                        return '';
                    }
                },
                { data: 'createTime' }
            ];
            
            // 如果是管理員，添加操作列
            if (currentUserRole === 'ROLE_ADMIN') {
                columns.push({
                    data: null,
                    orderable: false,
                    render: function(data, type, row) {
                        return `
                            <div class="action-buttons">
                                <button class="btn btn-sm btn-outline-primary edit-btn" data-station-id="${row.stationId}" title="${translate('Edit')}">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger delete-btn" data-station-id="${row.stationId}" data-station-name="${row.stationName || row.stationId}" title="${translate('Delete')}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                    }
                });
            }
            
            dataTable = $('#stationsTable').DataTable({
                data: stations,
                columns: columns,
                language: {
                    url: languageUrl
                },
                responsive: true,
                pageLength: 10,
                order: [0, 'asc'],
                drawCallback: function() {
                    // 綁定編輯按鈕事件
                    $('.edit-btn').off('click').on('click', function() {
                        const stationId = $(this).data('station-id');
                        editStation(stationId);
                    });
                    
                    // 綁定刪除按鈕事件
                    $('.delete-btn').off('click').on('click', function() {
                        const stationId = $(this).data('station-id');
                        const stationName = $(this).data('station-name');
                        showDeleteConfirm(stationId, stationName);
                    });
                }
            });
        }
        
        // 檢查用戶角色
        async function checkUserRole() {
            try {
                const response = await apiRequest('/UserRole');
                if (response && response.resultMsg) {
                    currentUserRole = response.resultMsg;
                    // 如果是管理員，顯示管理功能
                    if (currentUserRole === 'ROLE_ADMIN') {
                        $('#addStationBtn').show();
                        $('#actionsHeader').show();
                        await loadVendors(); // 加載廠商列表
                    } else {
                        $('#addStationBtn').hide();
                        $('#actionsHeader').hide();
                    }
                }
            } catch (error) {
                console.error('檢查用戶角色失敗:', error);
                showAlert('error', translate('Failed to check user role') + ': ' + error.message);
            }
        }
        
        // 加載廠商列表
        async function loadVendors() {
            try {
                const response = await apiRequest('/VendorInfo');
                if (response) {
                    vendors = Array.isArray(response) ? response : [];
                    
                    // 填充廠商下拉選單（批量生成 HTML，減少 DOM 操作）
                    const options = [`<option value="">${translate('Please select vendor')}</option>`];
                    vendors.forEach(vendor => {
                        options.push(`<option value="${vendor.vendorId}">${vendor.vendorId}</option>`);
                    });
                    $('#vendorId').html(options.join(''));
                }
            } catch (error) {
                console.error('加載廠商列表失敗:', error);
            }
        }
        
        // 加載充電站數據
        async function loadStations() {
            try {
                showLoading();
                
                let endpoint = '/StationInfo';
                const params = new URLSearchParams();
                
                // 添加搜索參數
                const search = $('#searchInput').val().trim();
                if (search) {
                    params.append('search', search);
                }
                
                // 添加狀態篩選參數
                const status = $('#statusFilter').val();
                if (status) {
                    params.append('status', status);
                }
                
                if (params.toString()) {
                    endpoint += '?' + params.toString();
                }
                
                const response = await apiRequest(endpoint);
                
                if (response) {
                    // 保存所有站點數據（用於國家篩選下拉框）
                    allStationsData = Array.isArray(response) ? response : [];
                    
                    // 國家篩選（前端過濾）
                    const countryFilter = document.getElementById('countryFilter');
                    const selectedCountry = countryFilter ? countryFilter.value : '';
                    if (selectedCountry) {
                        stations = allStationsData.filter(station => {
                            if (station.country) {
                                return station.country.toUpperCase() === selectedCountry;
                            }
                            return false;
                        });
                    } else {
                        stations = allStationsData;
                    }
                    
                    // 填充國家篩選下拉框（使用所有站點數據 allStationsData）
                    populateCountryFilter();
                    
                    initDataTable();
                    hideAlert();
                } else {
                    showAlert('error', translate('Failed to load station data'));
                }
            } catch (error) {
                console.error('加載充電站數據失敗:', error);
                showAlert('error', translate('Failed to load station data') + ': ' + error.message);
            } finally {
                hideLoading();
            }
        }
        
        // 新增充電站
        function addStation() {
            isEditMode = false;
            editingStationId = null;
            $('#stationModalLabel').text(translate('Add Station'));
            $('#stationForm')[0].reset();
            $('#stationId').prop('readonly', false);
            $('#stationModal').modal('show');
        }
        
        // 編輯充電站
        function editStation(stationId) {
            const station = stations.find(s => s.stationId === stationId);
            if (!station) {
                showAlert('error', translate('Station not found'));
                return;
            }
            
            isEditMode = true;
            editingStationId = stationId;
            $('#stationModalLabel').text(translate('Edit Station'));
            
            // 填充表單數據
            $('#stationId').val(station.stationId).prop('readonly', true);
            $('#vendorId').val(station.vendorId);
            $('#stationName').val(station.stationName || '');
            $('#stationKwh').val(station.stationKwh || '');
            $('#city').val(station.city || '');
            $('#address').val(station.address || '');
            $('#storageEnable').val(station.storageEnable || '');
            $('#powerSource').val(station.powerSource || '');
            $('#gpsLatitude').val(station.gpsLatitude || '');
            $('#gpsLongitude').val(station.gpsLongitude || '');
            $('#stationStatus').val(station.stationStatus || '');
            
            $('#stationModal').modal('show');
        }
        
        // 保存充電站
        async function saveStation() {
            const form = $('#stationForm')[0];
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const formData = new FormData(form);
            const stationData = {
                vendorId: formData.get('vendorId'),
                stationAry: [{
                    stationId: formData.get('stationId'),
                    stationName: formData.get('stationName'),
                    stationKwh: formData.get('stationKwh'),
                    city: formData.get('city'),
                    address: formData.get('address'),
                    storageEnable: formData.get('storageEnable'),
                    powerSource: formData.get('powerSource'),
                    gpsLatitude: formData.get('gpsLatitude'),
                    gpsLongitude: formData.get('gpsLongitude'),
                    stationStatus: formData.get('stationStatus'),
                    updateStatus: 'U' // U = 新增或更新
                }]
            };
            
            try {
                const response = await apiRequest('/StationInfo', 'POST', stationData);
                
                if (response && (response.code === '0000' || response.resultCode === '0000')) {
                    $('#stationModal').modal('hide');
                    const successMsg = isEditMode ? 
                        translate('Station updated successfully') :
                        translate('Station added successfully');
                    showAlert('success', successMsg);
                    await loadStations(); // 重新加載數據
                } else {
                    let errorMessage = '';
                    if (response) {
                        switch(response.code) {
                            case '0002':
                                errorMessage = translate('Unsupported operation type');
                                break;
                            case '0003':
                                errorMessage = translate('No permission to operate on another vendor\'s station');
                                break;
                            case '0004':
                                errorMessage = translate('Station does not exist');
                                break;
                            default:
                                errorMessage = response.resultMsg || response.message || 
                                    translate('Unknown error');
                        }
                    } else {
                        errorMessage = translate('Unknown error');
                    }
                    
                    const errorMsg = translate('Save failed') + ': ' + errorMessage;
                    showAlert('error', errorMsg);
                }
            } catch (error) {
                console.error('保存充電站失敗:', error);
                const errorMsg = translate('Save failed') + ': ' + error.message;
                showAlert('error', errorMsg);
            }
        }
        
        // 顯示刪除確認對話框
        function showDeleteConfirm(stationId, stationName) {
            const confirmMsg = translate('Are you sure you want to delete station') + ` ${stationName}?`;
            const warningMsg = translate('This action cannot be undone');
            $('#deleteStationName').text(stationName);
            $('#deleteConfirmModal .modal-body p:first').text(confirmMsg);
            $('#deleteConfirmModal .modal-body p:last').text(warningMsg);
            $('#confirmDeleteBtn').data('station-id', stationId);
            $('#deleteConfirmModal').modal('show');
        }
        
        // 刪除充電站
        async function deleteStation(stationId) {
            const station = stations.find(s => s.stationId === stationId);
            if (!station) {
                const errorMsg = translate('Station not found');
                showAlert('error', errorMsg);
                return;
            }
            const deleteData = {
                vendorId: station.vendorId,
                stationAry: [{
                    stationId: stationId,
                    updateStatus: 'D' // D = 刪除
                }]
            };
            try {
                const response = await apiRequest('/StationInfo', 'POST', deleteData);
                if (response && (response.code === '0000' || response.resultCode === '0000')) {
                    $('#deleteConfirmModal').modal('hide');
                    const successMsg = translate('Station deleted successfully');
                    showAlert('success', successMsg);
                    await loadStations(); // 重新加載數據
                } else {
                    // 只顯示後端回傳訊息
                    const errorMsg = (response?.resultMsg || response?.message || translate('Unknown error'));
                    showAlert('error', errorMsg);
                }
            } catch (error) {
                console.error('刪除充電站失敗:', error);
                const errorMsg = translate('Delete failed') + ': ' + error.message;
                showAlert('error', errorMsg);
            }
        }
        
        // 顯示載入中
        function showLoading() {
            $('#loadingSpinner').removeClass('d-none');
            $('#stationsTable').addClass('d-none');
        }
        
        // 隱藏載入中
        function hideLoading() {
            $('#loadingSpinner').addClass('d-none');
            $('#stationsTable').removeClass('d-none');
        }
        
        // 顯示警告信息
        function showAlert(type, message) {
            hideAlert();
            const alertId = type === 'error' ? '#errorAlert' : '#successAlert';
            $(alertId).text(message).removeClass('d-none');
            
            // 3秒後自動隱藏成功消息
            if (type === 'success') {
                setTimeout(hideAlert, 3000);
            }
        }
        
        // 隱藏警告信息
        function hideAlert() {
            $('#errorAlert, #successAlert').addClass('d-none');
        }
        
        // 頁面初始化
        $(document).ready(async function() {
            // 檢查認證
            if (!isAuthenticated()) {
                window.location.href = '/login';
                return;
            }
            
            // 檢查用戶角色
            await checkUserRole();
            
            // 加載充電站數據
            await loadStations();

            // 搜索框事件監聽
            $('#searchInput').on('keyup', function() {
                if (dataTable) {
                    dataTable.search(this.value).draw();
                }
            });

            // 刷新按鈕事件監聽
            $('#refreshBtn').on('click', function() {
                $('#searchInput').val('');
                $('#countryFilter').val('');
                $('#statusFilter').val('');
                loadStations();
            });

            // 狀態篩選事件監聽
            // 國家篩選變更事件
            $('#countryFilter').on('change', function() {
                loadStations();
            });
            
            $('#statusFilter').on('change', function() {
                loadStations();
            });

            // 綁定事件
            $('#addStationBtn').on('click', addStation);
            $('#saveStationBtn').on('click', saveStation);
            
            $('#confirmDeleteBtn').on('click', function() {
                const stationId = $(this).data('station-id');
                deleteStation(stationId);
            });
            
            // 確保管理員功能正確顯示
            if (currentUserRole === 'ROLE_ADMIN') {
                $('#addStationBtn').show();
                $('#actionsHeader').show();
            }
        });
    </script>
</body>
</html>
