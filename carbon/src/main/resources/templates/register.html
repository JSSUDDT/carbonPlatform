<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">註冊 - 碳權平台</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- 自定義CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
    <div class="container">
        <div class="auth-container">
            <div class="logo text-center">
                <i class="fas fa-leaf icon-green icon-large mb-3"></i>
                <h2 class="mb-1">碳權平台</h2>
                <p class="text-muted">註冊新賬號</p>
            </div>
            
            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="vendorId">廠商ID</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control" id="vendorId" name="vendorId" placeholder="請輸入廠商ID" required>
                    </div>
                    <small class="form-text text-muted">廠商ID將用作登錄名，請使用唯一標識。</small>
                </div>
                
                <div class="form-group">
                    <label for="password">密碼</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="password" name="password" placeholder="請輸入密碼" required>
                    </div>
                    <small class="form-text text-muted">請設置您的登錄密碼。</small>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">確認密碼</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="請再次輸入密碼" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>用戶角色</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleUser" value="ROLE_USER" checked>
                        <label class="form-check-label" for="roleUser">
                            <span class="badge badge-info">普通用戶</span> - 充電設施管理
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="ROLE_ADMIN">
                        <label class="form-check-label" for="roleAdmin">
                            <span class="badge badge-success">管理員</span> - 系統全部功能
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-user-plus mr-2"></i>註冊
                    </button>
                </div>
                
                <div class="text-center mt-3">
                    <p>已有賬號？ <a th:href="@{/login}">登錄</a></p>
                </div>
            </form>
            
            <div id="loadingSpinner" class="text-center d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only">加載中...</span>
                </div>
                <p class="mt-2">正在處理，請稍候...</p>
            </div>
        </div>
        
        <div class="footer mt-4">
            <div class="container text-center">
                <div class="mb-2">
                    <span class="text-muted" th:text="#{footer.copyright}">© 2023 碳權平台. 保留所有權利.</span>
                </div>
                <div>
                    <span class="text-muted">
                        <span th:text="#{footer.developed}">開發商</span>: 
                        <span th:text="#{footer.company.en}">gochabar</span> / 
                        <span th:text="#{footer.company.zh}">充壩</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 多語言支持 -->
    <script th:src="@{/js/locale.js}"></script>
    <!-- 自定義JavaScript -->
    <script th:src="@{/js/common.js}"></script>

    <!-- 語言選擇器 -->
    <div class="language-selector mb-4 text-center">
        <div class="btn-group btn-group-sm">
            <button type="button" class="btn btn-outline-secondary language-switch-btn" data-lang="en" th:text="#{language.en}">English</button>
            <button type="button" class="btn btn-outline-secondary language-switch-btn" data-lang="zh_TW" th:text="#{language.zh}">繁體中文</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 如果已經登錄，跳轉到充電交易頁面
            if (isAuthenticated()) {
                window.location.href = '/carbon/transactions.html';
                return;
            }
            
            // 註冊表單提交
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const vendorId = document.getElementById('vendorId').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const role = document.querySelector('input[name="role"]:checked').value;
                
                if (!vendorId || !password || !confirmPassword) {
                    showError('請填寫所有必填欄位');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showError('兩次密碼輸入不一致');
                    return;
                }
                
                const result = await register(vendorId, password, role);
                
                if (result.success) {
                    showSuccess('註冊成功，請前往登錄！');
                    document.getElementById('registerForm').reset();
                    
                    // 3秒後跳轉到登錄頁
                    setTimeout(() => {
                        window.location.href = '/carbon/login.html';
                    }, 3000);
                } else {
                    showError(result.message);
                }
            });
        });
    </script>
</body>
</html>
