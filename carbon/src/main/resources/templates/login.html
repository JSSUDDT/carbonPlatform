<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">登錄 - 碳權平台</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- 自定義CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        /* 語言選擇器右上角樣式 */
        .language-dropdown {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
        }
        
        .language-dropdown .dropdown-toggle {
            color: var(--primary-color);
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 6px 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }
        
        .language-dropdown .dropdown-toggle:hover {
            background-color: white;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }
        
        .language-dropdown .dropdown-menu {
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: none;
            margin-top: 5px;
        }
        
        .language-dropdown .dropdown-item {
            padding: 8px 15px;
            transition: all 0.2s;
        }
        
        .language-dropdown .dropdown-item:hover {
            background-color: var(--light-color);
        }
        
        /* 彩色國旗圖標 */
        .flag-icon {
            width: 20px;
            height: 15px;
            margin-right: 8px;
            vertical-align: middle;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    <!-- 右上角語言選擇器 -->
    <div class="language-dropdown dropdown">
        <button class="btn dropdown-toggle" type="button" id="languageDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <i class="fas fa-globe-asia mr-2"></i><span th:text="#{language.select}">語言</span>
        </button>
        <div class="dropdown-menu dropdown-menu-right" aria-labelledby="languageDropdown">
            <button class="dropdown-item language-switch-btn" data-lang="en">
                <img src="https://cdn.jsdelivr.net/npm/flag-icon-css@3.5.0/flags/4x3/us.svg" class="flag-icon" alt="USA flag">
                <span th:text="#{language.en}">English</span>
            </button>
            <button class="dropdown-item language-switch-btn" data-lang="zh_TW">
                <img src="https://cdn.jsdelivr.net/npm/flag-icon-css@3.5.0/flags/4x3/tw.svg" class="flag-icon" alt="Taiwan flag">
                <span th:text="#{language.zh}">繁體中文</span>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="auth-container">
            <div class="logo text-center">
                <i class="fas fa-leaf icon-green icon-large mb-3"></i>
                <h2 class="mb-1" th:text="#{app.name}">碳權平台</h2>
                <p class="text-muted" th:text="#{app.slogan}">綠色能源，智慧出行</p>
            </div>
            
            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="vendorId" th:text="#{login.vendorId}">廠商ID</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                        </div>
                        <input type="text" class="form-control" id="vendorId" name="vendorId" th:placeholder="#{login.vendorId}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" th:text="#{login.password}">密碼</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        </div>
                        <input type="password" class="form-control" id="password" name="password" th:placeholder="#{login.password}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        <span th:text="#{login.button}">登錄</span>
                    </button>
                </div>
            </form>
            
            <div id="loadingSpinner" class="text-center d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="sr-only" th:text="#{message.loading}">載入中...</span>
                </div>
                <p class="mt-2" th:text="#{login.processing}">正在處理，請稍候...</p>
            </div>
            
            <div class="bg-eco-gradient p-3 rounded mt-4">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <i class="fas fa-leaf fa-2x text-white"></i>
                    </div>
                    <div class="col">
                        <h5 class="m-0" th:text="#{sidebar.future}">共建綠色未來</h5>
                        <p class="small m-0" th:text="#{stations.ecoDesc}">優化能源消耗，減少碳足跡</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer mt-4">
            <div class="container text-center">
                <div class="mb-2">
                    <span class="text-muted" th:text="#{footer.copyright}">© 2023 碳權平台. 保留所有權利.</span>
                </div>
                <div>
                    <span class="text-muted">
                        <span th:text="#{footer.developed}">開發商</span>: 
                        <span th:text="#{footer.company.en}">gochabar</span> / 
                        <span th:text="#{footer.company.zh}">充壩</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap Bundle -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 多語言支持 -->
    <script th:src="@{/js/locale.js}"></script>
    <!-- 自定義JavaScript -->
    <script th:src="@{/js/common.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('登錄頁面載入，強制清除認證信息...');
            
            // 強制清除所有認證相關數據，確保用戶可以輸入新的帳號密碼
            // 傳遞false參數以防止logout函數重定向
            logout(false);
            
            // 登錄表單提交
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const vendorId = document.getElementById('vendorId').value;
                const password = document.getElementById('password').value;
                
                if (!vendorId || !password) {
                    showError(getI18nMessage('login.error.empty', '請輸入廠商ID和密碼'));
                    return;
                }
                
                const result = await login(vendorId, password);
                
                if (result.success) {
                    showSuccess(getI18nMessage('login.success', '登錄成功，正在跳轉...'));
                    setTimeout(() => {
                        window.location.href = '/carbon/transactions.html';
                    }, 1000);
                } else {
                    showError(getI18nMessage('login.failed', '登錄失敗，請檢查您的用戶名和密碼'));
                }
            });
        });
        
        // 獲取i18n消息
        function getI18nMessage(key, defaultMessage) {
            const element = document.querySelector(`[data-i18n="${key}"]`);
            return element ? element.textContent : defaultMessage;
        }
    </script>
    
    <!-- 隱藏的i18n元素，用於JavaScript獲取翻譯 -->
    <div style="display:none;">
        <span data-i18n="login.error.empty" th:text="#{login.error.empty}">請輸入廠商ID和密碼</span>
        <span data-i18n="login.success" th:text="#{login.success}">登錄成功，正在跳轉...</span>
        <span data-i18n="login.failed" th:text="#{login.failed}">登錄失敗，請檢查您的用戶名和密碼</span>
    </div>
</body>
</html>
