# 服务器配置
server.port=9095
server.servlet.context-path=/carbon

# 数据库连接配置
spring.datasource.url=jdbc:mysql://etreego.mysql.database.azure.com:3306/ccms_sit   
spring.datasource.username=parker
spring.datasource.password=a@CxMzz^_v4eeQaV6uEEZ$k8zvs8Wg&5>)UQe^*NWE+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA配置
spring.jpa.hibernate.ddl-auto=update
# 強制關閉Hibernate SQL日誌的系統屬性
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# 關閉Hibernate統計信息
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# 數據同步配置
sync.enabled=true
sync.cron=0 */10 * * * ?
sync.batch-size=1000

# 外部數據源配置（同一數據庫實例，不同schema）
sync.source-schema=ccms
sync.source-table=trans_mapping

# 同步策略配置
sync.sync-days=1
sync.max-records-per-sync=10000
sync.time-field=charge_start_time

# 即時同步配置
sync.real-time.enabled=true
sync.real-time.interval-seconds=300
sync.real-time.max-batch-size=1000

# 關閉Hibernate相關日誌
logging.level.org.hibernate=OFF
logging.level.org.hibernate.engine=OFF
logging.level.org.hibernate.jdbc=OFF
logging.level.org.hibernate.loader=OFF
logging.level.org.hibernate.persister=OFF
logging.level.org.hibernate.query=OFF
logging.level.org.hibernate.resource=OFF
logging.level.org.hibernate.transaction=OFF
logging.level.org.hibernate.type=OFF

# 關閉Spring Data JPA的SQL日誌
logging.level.org.springframework.orm.jpa=OFF
logging.level.org.springframework.jdbc=OFF

# 關閉所有SQL相關的日誌
logging.level.org.springframework.jdbc.core=OFF
logging.level.org.springframework.jdbc.datasource=OFF

# JWT配置
jwt.secret=carbonTradingPlatformSecretKey123456789012345678901234567890
jwt.expiration=43200000

# 日志配置
logging.level.root=INFO
logging.level.com.carbon=DEBUG
logging.level.com.carbon.api.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 設置日誌編碼為UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# 設置文件編碼
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.encoding.force-response=true
spring.http.encoding.force-request=true

# 設置Tomcat編碼
server.tomcat.uri-encoding=UTF-8

# 啟用ANSI彩色輸出（支持在控制台顯示彩色日誌）
spring.output.ansi.enabled=ALWAYS

# Thymeleaf 配置
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# 國際化配置
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=0
spring.messages.fallback-to-system-locale=false

# 應用程式日誌級別
logging.level.com.carbon.api=INFO
logging.level.org.springframework=WARN

