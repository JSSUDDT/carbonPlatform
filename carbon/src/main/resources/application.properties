# 服务器配置
server.port=9095
server.servlet.context-path=/carbon

# 数据库连接配置
spring.datasource.url=jdbc:mysql://etreego.mysql.database.azure.com:3306/ccms_sit   
spring.datasource.username=parker
spring.datasource.password=a@CxMzz^_v4eeQaV6uEEZ$k8zvs8Wg&5>)UQe^*NWE+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# JWT配置
jwt.secret=carbonTradingPlatformSecretKey123456789012345678901234567890
jwt.expiration=43200000

# 日志配置
logging.level.root=INFO
logging.level.com.carbon=DEBUG
logging.level.com.carbon.api.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# 設置日誌編碼為UTF-8
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# 設置文件編碼
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.encoding.force-response=true
spring.http.encoding.force-request=true

# 設置Tomcat編碼
server.tomcat.uri-encoding=UTF-8

# 啟用ANSI彩色輸出（支持在控制台顯示彩色日誌）
spring.output.ansi.enabled=ALWAYS

# Thymeleaf 配置
spring.thymeleaf.cache=false
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# 國際化配置
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=0
spring.messages.fallback-to-system-locale=false